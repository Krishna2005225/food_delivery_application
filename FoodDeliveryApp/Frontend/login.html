<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodieExpress</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: linear-gradient(135deg, rgba(255,107,53,0.9), rgba(247,147,30,0.9)), url('https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1'); background-size: cover; background-attachment: fixed; background-position: center; min-height: 100vh; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">FoodieExpress</div>
        <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="restaurants.html">Restaurants</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <div class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="loginPhone" required>
            </div>
            <button type="submit" class="btn-primary btn-full">Login</button>
        </form>
        <p class="form-link">Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const phone = document.getElementById('loginPhone').value;

            fetch('/api/customers/')
                .then(res => res.json())
                .then(customers => {
                    const customer = customers.find(c => c.email === email && c.phone === phone);
                    if (customer) {
                        localStorage.setItem('customerName', customer.full_name);
                        localStorage.setItem('customerId', customer.customer_id);
                        localStorage.setItem('customerEmail', customer.email);
                        alert('Login successful! Welcome, ' + customer.full_name);
                        window.location.href = 'index.html';
                    } else {
                        alert('Invalid credentials! Please register first.');
                    }
                });
        });
    </script>
</body>
</html>
