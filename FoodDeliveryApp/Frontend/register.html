<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FoodieExpress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">FoodieExpress</div>
        <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="restaurants.html">Restaurants</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="form-container">
        <h2>Register</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Customer ID</label>
                <input type="number" id="regId" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="regPhone" required>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="regAddress" required>
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" id="regCity" required>
            </div>
            <button type="submit" class="btn-primary btn-full">Register</button>
        </form>
        <p class="form-link">Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                customer_id: parseInt(document.getElementById('regId').value),
                full_name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                address: document.getElementById('regAddress').value,
                city: document.getElementById('regCity').value
            };

            fetch('/api/customers/add/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(() => {
                alert('Registration successful! Please login.');
                window.location.href = 'login.html';
            })
            .catch(() => alert('Registration failed!'));
        });
    </script>
</body>
</html>
